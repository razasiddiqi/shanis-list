<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Shani's List</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2a19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shani's List">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #ffffff;
    --bg-soft: #f4f9f5;
    --bg-tint: #e8f3ec;
    --green: #1e7a3e;
    --green-bright: #27a352;
    --green-dim: rgba(30,122,62,0.08);
    --ink: #0f2a19;
    --text: #1a3d26;
    --text-muted: #5a8a6a;
    --text-faint: #8aac95;
    --amber: #d97706;
    --amber-dim: rgba(217,119,6,0.1);
    --red: #dc2626;
    --red-dim: rgba(220,38,38,0.08);
    --border: rgba(30,122,62,0.12);
    --safe-top: env(safe-area-inset-top);
    --safe-bot: env(safe-area-inset-bottom);
  }

  html, body {
    height: 100%;
    overscroll-behavior-y: none;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-soft);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    padding-bottom: calc(72px + var(--safe-bot));
  }

  /* ─── Top bar ─────────────────────────────────────────────────── */
  .topbar {
    background: var(--bg);
    padding: calc(14px + var(--safe-top)) 18px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .brand span { color: var(--green); font-style: italic; }

  .topbar-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    border: none;
    cursor: pointer;
    position: relative;
  }
  .topbar-icon .badge-dot {
    position: absolute;
    top: 8px; right: 9px;
    width: 8px; height: 8px;
    background: var(--amber);
    border: 2px solid var(--bg);
    border-radius: 50%;
  }

  /* ─── Greeting + filter pills ─────────────────────────────────── */
  .greeting {
    padding: 18px 18px 8px;
  }
  .greeting h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.15;
    margin-bottom: 4px;
  }
  .greeting h1 em { color: var(--green); font-style: italic; }
  .greeting p {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .filter-bar {
    padding: 14px 18px 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .pill {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 100px;
    font-size: 12.5px;
    font-weight: 500;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .pill.active {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }
  .pill .count {
    font-size: 10.5px;
    opacity: 0.7;
    margin-left: 4px;
  }

  /* ─── Property feed ───────────────────────────────────────────── */
  .feed {
    padding: 4px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .deal-card {
    background: var(--bg);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15,42,25,0.04), 0 4px 12px rgba(15,42,25,0.04);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    animation: cardIn 0.4s ease-out backwards;
  }
  .deal-card:active { transform: scale(0.98); }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-image {
    height: 180px;
    background: linear-gradient(135deg, var(--bg-tint), var(--green-dim));
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-image svg { opacity: 0.4; }

  .card-badge {
    position: absolute;
    top: 12px; left: 12px;
    font-size: 10.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    backdrop-filter: blur(8px);
  }
  .badge-strong { background: rgba(30,122,62,0.92); color: white; }
  .badge-borderline { background: rgba(217,119,6,0.92); color: white; }
  .badge-pass { background: rgba(220,38,38,0.92); color: white; }

  .card-save {
    position: absolute;
    top: 12px; right: 12px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    transition: color 0.15s;
  }
  .card-save.saved { color: var(--red); }
  .card-save svg { width: 18px; height: 18px; }
  .card-save.saved svg { fill: currentColor; }

  .card-body {
    padding: 14px 16px 16px;
  }

  .card-row-1 {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }

  .card-addr {
    font-size: 16px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.2;
    flex: 1;
    margin-right: 10px;
  }

  .card-price {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--ink);
    line-height: 1;
    flex-shrink: 0;
  }

  .card-city {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  /* All-in vs ARV bar */
  .deal-bar {
    margin-bottom: 14px;
  }
  .deal-bar-top {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .deal-bar-pct { font-weight: 600; }
  .deal-bar-track {
    height: 6px;
    background: var(--bg-soft);
    border-radius: 100px;
    overflow: hidden;
    position: relative;
  }
  .deal-bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.5s ease;
  }
  .deal-70 {
    position: absolute;
    left: 70%;
    top: -2px; bottom: -2px;
    width: 1.5px;
    background: var(--ink);
    opacity: 0.4;
  }

  /* Profit grid */
  .profit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .profit-cell {
    background: var(--bg-soft);
    padding: 10px 12px;
  }
  .profit-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .profit-value {
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
  }
  .profit-value.tight { color: var(--amber); }
  .profit-value.negative { color: var(--red); }

  /* Card actions */
  .card-actions {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
  }
  .btn {
    font-family: inherit;
    font-weight: 500;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--ink);
    color: white;
    padding: 12px 16px;
    font-size: 14px;
  }
  .btn-icon {
    background: var(--bg-soft);
    color: var(--ink);
    width: 44px; height: 44px;
  }
  .btn-icon svg { width: 18px; height: 18px; }

  /* ─── Bottom nav ──────────────────────────────────────────────── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 8px 0 calc(6px + var(--safe-bot));
    z-index: 40;
  }
  .nav-tab {
    background: none;
    border: none;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 10.5px;
    transition: color 0.15s;
  }
  .nav-tab.active { color: var(--ink); }
  .nav-tab svg { width: 22px; height: 22px; }

  /* ─── Detail sheet (bottom sheet) ─────────────────────────────── */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,42,25,0.4);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 100;
  }
  .sheet-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 110;
    max-height: 92vh;
    overflow-y: auto;
    padding-bottom: var(--safe-bot);
    -webkit-overflow-scrolling: touch;
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 100px;
    margin: 10px auto 4px;
  }

  .sheet-header {
    padding: 12px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .sheet-sub {
    font-size: 13px;
    color: var(--text-muted);
  }

  .sheet-image {
    height: 200px;
    background: linear-gradient(135deg, var(--bg-tint), var(--green-dim));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sheet-section {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-section:last-child { border-bottom: none; }

  .sheet-section-title {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .num-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
  }
  .num-row .label { color: var(--text-muted); }
  .num-row .val { color: var(--ink); font-weight: 500; }
  .num-row .val.big {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 400;
  }

  .objection {
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .objection-q {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .objection-a {
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.5;
  }

  .sheet-cta {
    padding: 16px 20px calc(20px + var(--safe-bot));
    background: var(--bg);
    border-top: 1px solid var(--border);
    position: sticky;
    bottom: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .sheet-cta .btn-primary { padding: 14px; font-size: 15px; }
  .sheet-cta .btn-secondary {
    background: var(--bg-soft);
    color: var(--ink);
    padding: 14px;
    font-size: 15px;
  }

  /* ─── Install prompt ──────────────────────────────────────────── */
  .install-prompt {
    position: fixed;
    left: 14px; right: 14px;
    bottom: calc(82px + var(--safe-bot));
    background: var(--ink);
    color: white;
    border-radius: 14px;
    padding: 14px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    z-index: 60;
    box-shadow: 0 10px 30px rgba(15,42,25,0.3);
    animation: slideUp 0.4s ease-out;
  }
  .install-prompt.show { display: flex; }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .install-icon {
    width: 38px; height: 38px;
    background: var(--green);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'Playfair Display', serif;
    color: white;
    font-size: 18px;
  }
  .install-text {
    flex: 1;
    font-size: 12.5px;
    line-height: 1.3;
  }
  .install-text strong { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .install-text span { color: rgba(255,255,255,0.7); }

  .install-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .install-btn {
    background: white;
    color: var(--ink);
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .install-dismiss {
    background: transparent;
    color: rgba(255,255,255,0.6);
    border: none;
    padding: 8px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }

  /* ─── Toast ───────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: calc(86px + var(--safe-bot));
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--ink);
    color: white;
    padding: 11px 18px;
    border-radius: 100px;
    font-size: 13px;
    box-shadow: 0 10px 30px rgba(15,42,25,0.3);
    opacity: 0;
    transition: all 0.25s;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- ─── Top bar ─── -->
<header class="topbar">
  <div class="brand">Shani's <span>List</span></div>
  <button class="topbar-icon" aria-label="Notifications" onclick="showToast('3 new deals this week')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span class="badge-dot"></span>
  </button>
</header>

<!-- ─── Greeting ─── -->
<section class="greeting">
  <h1>Good morning, <em>Mike</em></h1>
  <p>5 new off-market deals matched your criteria</p>
</section>

<!-- ─── Filter pills ─── -->
<div class="filter-bar" id="filters">
  <button class="pill active" data-filter="all">All <span class="count">12</span></button>
  <button class="pill" data-filter="strong">Strong <span class="count">7</span></button>
  <button class="pill" data-filter="borderline">Borderline <span class="count">3</span></button>
  <button class="pill" data-filter="saved">Saved <span class="count">0</span></button>
  <button class="pill" data-filter="new">New <span class="count">5</span></button>
</div>

<!-- ─── Feed ─── -->
<main class="feed" id="feed"></main>

<!-- ─── Bottom nav ─── -->
<nav class="bottom-nav">
  <button class="nav-tab active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Deals
  </button>
  <button class="nav-tab" onclick="showToast('Map view coming soon')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    Map
  </button>
  <button class="nav-tab" onclick="setFilter('saved')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    Saved
  </button>
  <button class="nav-tab" onclick="showToast('Profile · Pro Plan')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Profile
  </button>
</nav>

<!-- ─── Detail sheet ─── -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<aside class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-image">
    <svg width="64" height="64" viewBox="0 0 48 48" fill="none">
      <rect x="6" y="20" width="36" height="22" rx="2" fill="#1e7a3e" opacity="0.3"/>
      <polygon points="4,22 24,6 44,22" fill="#1e7a3e" opacity="0.3"/>
    </svg>
  </div>
  <div id="sheet-content"></div>
</aside>

<!-- ─── Install prompt ─── -->
<div class="install-prompt" id="install-prompt">
  <div class="install-icon">S</div>
  <div class="install-text">
    <strong>Install Shani's List</strong>
    <span>Get instant deal alerts on your home screen</span>
  </div>
  <div class="install-actions">
    <button class="install-btn" onclick="installApp()">Install</button>
    <button class="install-dismiss" onclick="dismissInstall()" aria-label="Dismiss">×</button>
  </div>
</div>

<!-- ─── Toast ─── -->
<div class="toast" id="toast">Saved</div>

<script>
  // ─── Sample data ──────────────────────────────────────────────
  const properties = [
    {
      id: 1, addr: "2810 Forest Ln", city: "Plano, TX 75093",
      price: 285000, rehab: 45000, cma: 475000, beds: 3, baths: 2, sqft: 1840,
      isNew: true, notes: "Vacant. Foundation inspected — minor pier work only. Seller motivated, quick close preferred.",
      objections: [
        { q: "Why is it so cheap?", a: "Estate sale. Heirs out of state, want it gone in 30 days." },
        { q: "Real rehab cost?", a: "Estimated by contractor we've used on 12 prior flips — kitchen, baths, paint, flooring." },
        { q: "Comps?", a: "3 sold within 0.4 mi in last 60 days, 1820–1900 sqft, $465K–$485K." }
      ]
    },
    {
      id: 2, addr: "1456 Crestview Dr", city: "Frisco, TX 75034",
      price: 410000, rehab: 65000, cma: 685000, beds: 4, baths: 3, sqft: 2450,
      isNew: true, notes: "Pre-foreclosure. Owner relocating for work, has 3 weeks.",
      objections: [
        { q: "Title clean?", a: "Yes — verified through our title partner. No liens." },
        { q: "Neighborhood?", a: "Frisco ISD, walk to elementary. Median sale $720K." }
      ]
    },
    {
      id: 3, addr: "9023 Rolling Hills", city: "McKinney, TX 75070",
      price: 245000, rehab: 38000, cma: 395000, beds: 3, baths: 2, sqft: 1620,
      isNew: true, notes: "Inherited property. Tenant on month-to-month — can deliver vacant.",
      objections: [
        { q: "Tenant situation?", a: "Currently $1,650/mo. Will deliver vacant or assigned, your choice." }
      ]
    },
    {
      id: 4, addr: "734 W 8th St", city: "Dallas, TX 75208",
      price: 310000, rehab: 115000, cma: 550000, beds: 3, baths: 2, sqft: 1950,
      isNew: false, notes: "Heavy rehab — full gut. Bishop Arts walking distance.",
      objections: [
        { q: "Why the heavy rehab number?", a: "Knob-and-tube wiring, galvanized plumbing, original kitchen. Full reset." }
      ]
    },
    {
      id: 5, addr: "4803 Reiger Ave", city: "Dallas, TX 75246",
      price: 365000, rehab: 50000, cma: 520000, beds: 3, baths: 2, sqft: 1780,
      isNew: false, notes: "East Dallas, rapidly appreciating zip.",
      objections: [
        { q: "Margin tight, why look?", a: "Holding play — area appreciated 9% YoY. Could BRRRR with strong rent comps." }
      ]
    },
  ];

  const saved = new Set();
  let activeFilter = 'all';

  // ─── Helpers ──────────────────────────────────────────────────
  const fmt = n => '$' + Math.round(n).toLocaleString();
  function dealTier(pct) {
    if (pct <= 70) return { label: 'Strong Deal', cls: 'badge-strong', color: '#1e7a3e' };
    if (pct <= 80) return { label: 'Borderline', cls: 'badge-borderline', color: '#d97706' };
    return { label: 'Pass', cls: 'badge-pass', color: '#dc2626' };
  }
  function calcProfits(p) {
    const realty = p.cma * 0.04;
    const cashProfit = p.cma - p.price - p.rehab - realty;
    const hmCosts = p.price * (0.02 + (0.12/12*5) + 0.03);
    const hmProfit = p.cma - p.price - p.rehab - realty - hmCosts;
    return { cashProfit, hmProfit };
  }
  function profitCls(v) { return v > 30000 ? '' : v > 0 ? 'tight' : 'negative'; }
  function profitFmt(v) { return (v >= 0 ? fmt(v) : '-' + fmt(Math.abs(v))); }

  // ─── Render feed ──────────────────────────────────────────────
  function renderFeed() {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    const filtered = properties.filter(p => {
      const pct = (p.price + p.rehab) / p.cma * 100;
      const tier = dealTier(pct);
      if (activeFilter === 'all') return true;
      if (activeFilter === 'saved') return saved.has(p.id);
      if (activeFilter === 'new') return p.isNew;
      if (activeFilter === 'strong') return pct <= 70;
      if (activeFilter === 'borderline') return pct > 70 && pct <= 80;
      return true;
    });

    if (filtered.length === 0) {
      feed.innerHTML = `<div style="text-align:center; padding: 60px 20px; color: var(--text-muted); font-size: 14px;">
        No deals match this filter yet.<br><span style="font-size:12px; color: var(--text-faint);">Pull down to refresh</span>
      </div>`;
      updateSavedCount();
      return;
    }

    filtered.forEach((p, i) => {
      const allIn = p.price + p.rehab;
      const pct = (allIn / p.cma) * 100;
      const tier = dealTier(pct);
      const { cashProfit, hmProfit } = calcProfits(p);
      const isSaved = saved.has(p.id);

      const card = document.createElement('article');
      card.className = 'deal-card';
      card.style.animationDelay = (i * 50) + 'ms';
      card.innerHTML = `
        <div class="card-image">
          <svg width="56" height="56" viewBox="0 0 48 48" fill="none">
            <rect x="6" y="20" width="36" height="22" rx="2" fill="#1e7a3e"/>
            <polygon points="4,22 24,6 44,22" fill="#1e7a3e"/>
            <rect x="18" y="30" width="12" height="12" rx="1" fill="#e8f3ec"/>
          </svg>
          <span class="card-badge ${tier.cls}">${tier.label}</span>
          <button class="card-save ${isSaved ? 'saved' : ''}" data-id="${p.id}" aria-label="Save">
            <svg viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
        </div>
        <div class="card-body">
          <div class="card-row-1">
            <div class="card-addr">${p.addr}</div>
            <div class="card-price">${fmt(p.price)}</div>
          </div>
          <div class="card-city">${p.city} · ${p.beds} bd · ${p.baths} ba · ${p.sqft.toLocaleString()} sqft</div>

          <div class="deal-bar">
            <div class="deal-bar-top">
              <span>All-in vs ARV</span>
              <span class="deal-bar-pct" style="color:${tier.color}">${pct.toFixed(1)}%</span>
            </div>
            <div class="deal-bar-track">
              <div class="deal-bar-fill" style="width:${Math.min(pct,100)}%; background:${tier.color};"></div>
              <div class="deal-70"></div>
            </div>
          </div>

          <div class="profit-grid">
            <div class="profit-cell">
              <div class="profit-label">Cash Profit</div>
              <div class="profit-value ${profitCls(cashProfit)}">${profitFmt(cashProfit)}</div>
            </div>
            <div class="profit-cell">
              <div class="profit-label">Hard Money</div>
              <div class="profit-value ${profitCls(hmProfit)}">${profitFmt(hmProfit)}</div>
            </div>
          </div>

          <div class="card-actions">
            <button class="btn btn-primary" data-action="details" data-id="${p.id}">View Details</button>
            <button class="btn btn-icon" data-action="map" data-id="${p.id}" aria-label="Map">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </button>
            <button class="btn btn-icon" data-action="call" data-id="${p.id}" aria-label="Call">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
          </div>
        </div>
      `;
      feed.appendChild(card);
    });

    updateSavedCount();
    bindCardEvents();
  }

  function updateSavedCount() {
    document.querySelector('[data-filter="saved"] .count').textContent = saved.size;
  }

  function bindCardEvents() {
    document.querySelectorAll('.card-save').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = +btn.dataset.id;
        if (saved.has(id)) {
          saved.delete(id);
          btn.classList.remove('saved');
          btn.querySelector('svg').setAttribute('fill', 'none');
          showToast('Removed from saved');
        } else {
          saved.add(id);
          btn.classList.add('saved');
          btn.querySelector('svg').setAttribute('fill', 'currentColor');
          showToast('Saved · we\'ll alert you on price changes');
        }
        updateSavedCount();
      });
    });

    document.querySelectorAll('[data-action="details"]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        openSheet(+btn.dataset.id);
      });
    });

    document.querySelectorAll('[data-action="map"]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const p = properties.find(x => x.id === +btn.dataset.id);
        window.open(`https://maps.google.com/?q=${encodeURIComponent(p.addr+', '+p.city)}`, '_blank');
      });
    });

    document.querySelectorAll('[data-action="call"]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        showToast('Calling Shani · 555-0142');
      });
    });
  }

  // ─── Detail sheet ─────────────────────────────────────────────
  function openSheet(id) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    const allIn = p.price + p.rehab;
    const pct = (allIn / p.cma) * 100;
    const tier = dealTier(pct);
    const { cashProfit, hmProfit } = calcProfits(p);

    document.getElementById('sheet-content').innerHTML = `
      <div class="sheet-header">
        <div class="sheet-title">${p.addr}</div>
        <div class="sheet-sub">${p.city} · ${p.beds} bd · ${p.baths} ba · ${p.sqft.toLocaleString()} sqft</div>
      </div>

      <div class="sheet-section">
        <div class="sheet-section-title">The Numbers</div>
        <div class="num-row"><span class="label">List price</span><span class="val big">${fmt(p.price)}</span></div>
        <div class="num-row"><span class="label">Estimated rehab</span><span class="val">${fmt(p.rehab)}</span></div>
        <div class="num-row"><span class="label">All-in cost</span><span class="val">${fmt(allIn)}</span></div>
        <div class="num-row"><span class="label">After-repair value</span><span class="val">${fmt(p.cma)}</span></div>
        <div class="num-row"><span class="label">All-in vs ARV</span><span class="val" style="color:${tier.color}">${pct.toFixed(1)}% · ${tier.label}</span></div>
      </div>

      <div class="sheet-section">
        <div class="sheet-section-title">Estimated Profit</div>
        <div class="num-row"><span class="label">Cash purchase</span><span class="val ${profitCls(cashProfit)}" style="color:${cashProfit > 30000 ? 'var(--green)' : cashProfit > 0 ? 'var(--amber)' : 'var(--red)'}">${profitFmt(cashProfit - 15000)} – ${profitFmt(cashProfit + 15000)}</span></div>
        <div class="num-row"><span class="label">Hard money (5mo)</span><span class="val ${profitCls(hmProfit)}" style="color:${hmProfit > 30000 ? 'var(--green)' : hmProfit > 0 ? 'var(--amber)' : 'var(--red)'}">${profitFmt(hmProfit - 15000)} – ${profitFmt(hmProfit + 15000)}</span></div>
      </div>

      <div class="sheet-section">
        <div class="sheet-section-title">Wholesaler Notes</div>
        <p style="font-size:14px; line-height:1.6; color:var(--text);">${p.notes}</p>
      </div>

      <div class="sheet-section">
        <div class="sheet-section-title">Common Questions</div>
        ${p.objections.map(o => `
          <div class="objection">
            <div class="objection-q">${o.q}</div>
            <div class="objection-a">${o.a}</div>
          </div>
        `).join('')}
      </div>

      <div class="sheet-cta">
        <button class="btn btn-secondary" onclick="window.open('https://maps.google.com/?q=${encodeURIComponent(p.addr+', '+p.city)}','_blank')">
          📍 Drive there
        </button>
        <button class="btn btn-primary" onclick="showToast('Calling Shani · 555-0142'); closeSheet();">
          Contact Shani
        </button>
      </div>
    `;

    document.getElementById('sheet-overlay').classList.add('open');
    document.getElementById('sheet').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeSheet() {
    document.getElementById('sheet-overlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ─── Filters ──────────────────────────────────────────────────
  function setFilter(name) {
    activeFilter = name;
    document.querySelectorAll('.pill').forEach(p => {
      p.classList.toggle('active', p.dataset.filter === name);
    });
    renderFeed();
  }

  document.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => setFilter(pill.dataset.filter));
  });

  // ─── Toast ────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    clearTimeout(toastTimer);
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ─── Install prompt (PWA) ─────────────────────────────────────
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstall = e;
    if (!localStorage.getItem('install-dismissed')) {
      setTimeout(() => document.getElementById('install-prompt').classList.add('show'), 3000);
    }
  });

  function installApp() {
    if (!deferredInstall) {
      // Fallback for iOS — show instructions
      showToast('Tap Share, then "Add to Home Screen"');
      dismissInstall();
      return;
    }
    deferredInstall.prompt();
    deferredInstall.userChoice.then(() => {
      dismissInstall();
      deferredInstall = null;
    });
  }

  function dismissInstall() {
    document.getElementById('install-prompt').classList.remove('show');
    localStorage.setItem('install-dismissed', '1');
  }

  // Show install prompt on iOS where beforeinstallprompt doesn't fire
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isIOS && !isStandalone && !localStorage.getItem('install-dismissed')) {
    setTimeout(() => document.getElementById('install-prompt').classList.add('show'), 4000);
  }

  // ─── Service worker ───────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // ─── Init ─────────────────────────────────────────────────────
  renderFeed();
</script>
</body>
</html>
